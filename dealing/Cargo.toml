[workspace]
resolver = "2"
members = [
    "crates/bp52-bitcoin",
    "crates/bp52-circuit",
    "crates/bp52-cli",
    "crates/bp52-codec",
    "crates/bp52-group",
    "crates/bp52-proof-backend",
    "crates/bp52-protocol",
    "crates/bp52-sigma",
    "crates/bp52-uniqueness",
]
# Keep the pinned upstream backend as a dependency, not a workspace member. This
# ensures workspace-wide lint and test commands exercise only BP52-owned code.
exclude = ["vendor/bulletproofs", "fuzz", "benchmarks"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["BP52 contributors"]

[workspace.dependencies]
bitcoin = { version = "=0.32.102", default-features = false, features = ["std", "rand-std", "secp-recovery"] }
bitcoin_hashes = "=0.14.101"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
bulletproofs = { path = "vendor/bulletproofs", default-features = false, features = ["std", "yoloproofs"] }
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "digest", "precomputed-tables", "rand_core", "zeroize"] }
merlin = "=3.0.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rayon = "=1.12.0"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.20"
zeroize = { version = "=1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true
panic = "abort"

[profile.bench]
debug = true
