[package]
name = "bp52-benchmarks"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"

[dependencies]
bitcoin = { version = "=0.32.102", default-features = false, features = ["std", "rand-std", "secp-recovery"] }
bp52-circuit = { path = "../crates/bp52-circuit" }
bp52-codec = { path = "../crates/bp52-codec" }
bp52-group = { path = "../crates/bp52-group" }
bp52-protocol = { path = "../crates/bp52-protocol" }
bp52-sigma = { path = "../crates/bp52-sigma" }
bp52-uniqueness = { path = "../crates/bp52-uniqueness" }
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "digest", "precomputed-tables", "rand_core", "zeroize"] }
merlin = "=3.0.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = "=0.10.9"
