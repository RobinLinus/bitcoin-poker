[package]
name = "bp52-protocol"
publish = false
description = "Authenticated BP52-DEAL-v1 protocol state machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["rust-secp256k1-auth"]
# Exposes state-transition hooks only to the standalone cargo-fuzz package.
fuzzing = []
rust-secp256k1-auth = ["dep:bitcoin"]
pure-rust-bip340 = ["dep:k256"]

[dependencies]
bitcoin = { workspace = true, optional = true }
chacha20poly1305.workspace = true
bp52-circuit = { path = "../bp52-circuit" }
bp52-codec = { path = "../bp52-codec" }
bp52-group = { path = "../bp52-group" }
bp52-sigma = { path = "../bp52-sigma" }
bp52-uniqueness = { path = "../bp52-uniqueness" }
curve25519-dalek.workspace = true
merlin.workspace = true
rand_core.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr"], optional = true }

[lints]
workspace = true
