name: Scheduled fuzz smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dealing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned nightly toolchain
        run: rustup toolchain install nightly-2026-09-01 --profile minimal
      - name: Install pinned cargo-fuzz driver
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz bounded wire decoders
        run: cargo +nightly-2026-09-01 fuzz run wire_decode -- -max_total_time=60 -max_len=80000
      - name: Fuzz proof parsers
        run: cargo +nightly-2026-09-01 fuzz run proof_parse -- -max_total_time=60 -max_len=25000
      - name: Fuzz schedule validation
        run: cargo +nightly-2026-09-01 fuzz run state_schedule -- -max_total_time=60 -max_len=80000
      - name: Preserve crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bp52-fuzz-artifacts-${{ github.run_id }}
          path: dealing/fuzz/artifacts
          if-no-files-found: ignore

  chain-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: chain
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned nightly toolchain
        run: rustup toolchain install nightly-2026-09-01 --profile minimal
      - name: Install pinned cargo-fuzz driver
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz canonical chain decoders
        run: cargo +nightly-2026-09-01 fuzz run chain_decode -- -max_total_time=120 -max_len=1000000
      - name: Fuzz runtime and Lamport decoders
        run: cargo +nightly-2026-09-01 fuzz run witness_lamport_decode -- -max_total_time=120 -max_len=8192
      - name: Preserve chain crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bp52-chain-fuzz-artifacts-${{ github.run_id }}
          path: chain/fuzz/artifacts
          if-no-files-found: ignore
