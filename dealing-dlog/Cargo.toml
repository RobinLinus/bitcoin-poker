[workspace]
resolver = "2"
members = [
  "crates/dlog52-codec",
  "crates/dlog52-group",
  "crates/dlog52-transcript",
  "crates/dlog52-proofs",
  "crates/dlog52-uniqueness",
  "crates/dlog52-protocol",
  "crates/dlog52-openings",
  "crates/dlog52-bitcoin",
  "crates/dlog52-wasm",
  "crates/dlog52-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bitcoin = { version = "=0.32.102", default-features = false, features = ["std", "rand-std", "secp-recovery"] }
hex = "=0.4.3"
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "hash2curve", "schnorr", "std"] }
once_cell = "=1.21.4"
rand_core = "=0.6.4"
rand_chacha = "=0.3.1"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.20"
zeroize = { version = "=1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true
panic = "abort"
