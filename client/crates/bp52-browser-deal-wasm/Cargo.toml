[package]
name = "bp52-browser-deal-wasm"
publish = false
description = "Dedicated Web Worker/Wasm runtime for the real BP52-DEAL-v1 protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["raw-worker-entropy"]
# Raw Worker build: WebCrypto supplies the one seed through the fixed init
# request, and this crate owns getrandom's fallback callback without JS glue.
raw-worker-entropy = ["getrandom/custom"]
# Compile profile for applications that run wasm-bindgen-generated glue.
wasm-bindgen-entropy = ["getrandom/js"]

[dependencies]
bp52-circuit = { path = "../../../dealing/crates/bp52-circuit" }
bp52-codec = { path = "../../../dealing/crates/bp52-codec" }
bp52-group = { path = "../../../dealing/crates/bp52-group" }
bp52-sigma = { path = "../../../dealing/crates/bp52-sigma" }
bp52-uniqueness = { path = "../../../dealing/crates/bp52-uniqueness" }
rand_core = { version = "=0.6.4", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize = { version = "=1.9.0", features = ["derive"] }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
bp52-protocol.workspace = true

# These two dependencies intentionally feature-unify transitive browser
# requirements. Entropy itself enters once through the Worker's WebCrypto seed
# and is expanded by the zeroizing local DRBG, so the raw ABI needs no JS glue.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
bp52-protocol = { path = "../../../dealing/crates/bp52-protocol", default-features = false, features = ["pure-rust-bip340"] }
clear_on_drop = { version = "=0.2.5", default-features = false, features = ["no_cc"] }
getrandom = { version = "=0.2.17", default-features = false }

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
