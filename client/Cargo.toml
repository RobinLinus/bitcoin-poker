[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["BP52 contributors"]

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "=0.23.1"
futures = "=0.3.31"
hmac = "=0.12.1"
libp2p = { version = "=0.56.0", default-features = false, features = ["cbor", "dns", "dcutr", "ed25519", "identify", "macros", "noise", "ping", "quic", "relay", "request-response", "tcp", "tokio", "yamux"] }
rand = "=0.8.5"
bitcoin = { version = "=0.32.102", default-features = false, features = ["std", "rand-std", "secp-recovery"] }
http = "=1.5.0"
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic"] }
bp52-chain-bitcoin = { path = "../chain/crates/bp52-chain-bitcoin" }
bp52-chain-compiler = { path = "../chain/crates/bp52-chain-compiler" }
bp52-chain-runtime = { path = "../chain/crates/bp52-chain-runtime" }
bp52-chain-types = { path = "../chain/crates/bp52-chain-types" }
bp52-protocol = { path = "../dealing/crates/bp52-protocol" }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true
panic = "abort"
