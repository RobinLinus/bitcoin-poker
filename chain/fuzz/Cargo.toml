[package]
name = "bp52-chain-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
bitcoin = "=0.32.102"
bp52-chain-bitcoin = { path = "../crates/bp52-chain-bitcoin" }
bp52-chain-compiler = { path = "../crates/bp52-chain-compiler" }
bp52-chain-runtime = { path = "../crates/bp52-chain-runtime" }
bp52-chain-types = { path = "../crates/bp52-chain-types" }
bp52-codec = { path = "../../dealing/crates/bp52-codec" }
bp52-lamport = { path = "../crates/bp52-lamport" }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "chain_decode"
path = "fuzz_targets/chain_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "witness_lamport_decode"
path = "fuzz_targets/witness_lamport_decode.rs"
test = false
doc = false
bench = false
