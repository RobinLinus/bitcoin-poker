[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["BP52 contributors"]

[workspace.dependencies]
bitcoin = { version = "=0.32.102", default-features = false, features = ["std", "rand-std", "secp-recovery"] }
bitcoin_hashes = "=0.14.101"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
bp52-bitcoin = { path = "../dealing/crates/bp52-bitcoin" }
bp52-codec = { path = "../dealing/crates/bp52-codec" }
bp52-group = { path = "../dealing/crates/bp52-group" }
bp52-protocol = { path = "../dealing/crates/bp52-protocol" }
dlog52-bitcoin = { path = "../dealing-dlog/crates/dlog52-bitcoin" }
dlog52-protocol = { path = "../dealing-dlog/crates/dlog52-protocol" }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
secp256k1 = { version = "=0.29.1", default-features = false, features = ["alloc", "global-context", "rand-std"] }
sha2 = "=0.10.9"
thiserror = "=2.0.20"
zeroize = { version = "=1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true
panic = "abort"
