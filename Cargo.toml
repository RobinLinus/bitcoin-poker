[workspace]
resolver = "2"
members = ["crates/*", "apps/relay", "tools/deal-tools", "tools/settlement-benchmark"]
default-members = ["apps/relay", "crates/poker-settlement"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Bitcoin Poker contributors"]

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "=0.23.1"
bitcoin = { version = "=0.32.102", default-features = false, features = ["rand-std", "secp-recovery", "std"] }
bitcoin_hashes = "=0.14.101"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
deal-tools = { path = "tools/deal-tools" }
dealer-bitcoin = { path = "crates/dealer-bitcoin" }
dealer-codec = { path = "crates/dealer-codec" }
dealer-group = { path = "crates/dealer-group" }
dealer-openings = { path = "crates/dealer-openings" }
dealer-proofs = { path = "crates/dealer-proofs" }
dealer-protocol = { path = "crates/dealer-protocol" }
dealer-transcript = { path = "crates/dealer-transcript" }
dealer-uniqueness = { path = "crates/dealer-uniqueness" }
dealer-wasm = { path = "crates/dealer-wasm" }
futures = "=0.3.31"
hex = "=0.4.3"
hmac = "=0.12.1"
http = "=1.5.0"
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic"] }
libp2p = { version = "=0.56.0", default-features = false, features = ["cbor", "dcutr", "dns", "ed25519", "identify", "macros", "noise", "ping", "quic", "relay", "request-response", "tcp", "tokio", "yamux"] }
once_cell = "=1.21.4"
poker-bitcoin = { path = "crates/poker-bitcoin" }
poker-chain-monitor = { path = "crates/poker-chain-monitor" }
poker-client-ports = { path = "crates/poker-client-ports" }
poker-codec = { path = "crates/poker-codec" }
poker-core-test-support = { path = "crates/poker-core-test-support" }
poker-esplora = { path = "crates/poker-esplora" }
poker-eval = { path = "crates/poker-eval" }
poker-funding = { path = "crates/poker-funding" }
poker-funding-wasm = { path = "crates/poker-funding-wasm" }
poker-relay = { path = "apps/relay" }
poker-score-ots = { path = "crates/poker-score-ots" }
poker-session = { path = "crates/poker-session" }
poker-session-wasm = { path = "crates/poker-session-wasm" }
poker-settlement = { path = "crates/poker-settlement" }
poker-settlement-types = { path = "crates/poker-settlement-types" }
poker-store-sqlite = { path = "crates/poker-store-sqlite" }
poker-transaction-wasm = { path = "crates/poker-transaction-wasm" }
poker-transport-libp2p = { path = "crates/poker-transport-libp2p" }
poker-wallet-wasm = { path = "crates/poker-wallet-wasm" }
rand = "=0.8.5"
rand_chacha = "=0.3.1"
rand_core = "=0.6.4"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
secp256k1 = { version = "=0.29.1", default-features = false, features = ["alloc", "global-context", "rand-std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true
panic = "abort"
